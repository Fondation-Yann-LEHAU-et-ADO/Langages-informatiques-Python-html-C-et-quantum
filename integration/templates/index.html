<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculatrice Intégrée - Python + C++</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
            color: #fff;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(90deg, #e94560, #0f3460);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .status-badge {
            display: inline-block;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 0.9rem;
            margin-top: 0.5rem;
        }

        .status-cpp {
            background: linear-gradient(90deg, #00b894, #00cec9);
            color: #fff;
        }

        .status-python {
            background: linear-gradient(90deg, #fdcb6e, #e17055);
            color: #fff;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 2rem;
            justify-content: center;
            max-width: 1200px;
        }

        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 2rem;
            width: 400px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .card h2 {
            color: #e94560;
            margin-bottom: 1.5rem;
            font-size: 1.3rem;
            text-align: center;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #a0a0a0;
            font-size: 0.9rem;
        }

        input, select {
            width: 100%;
            padding: 0.8rem;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.3);
            color: #fff;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #e94560;
        }

        select option {
            background: #1a1a2e;
            color: #fff;
        }

        .input-row {
            display: flex;
            gap: 1rem;
        }

        .input-row .form-group {
            flex: 1;
        }

        button {
            width: 100%;
            padding: 1rem;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 0.5rem;
        }

        .btn-primary {
            background: linear-gradient(90deg, #e94560, #ff6b6b);
            color: #fff;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(233, 69, 96, 0.4);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .result-box {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            padding: 1.5rem;
            text-align: center;
            margin-top: 1rem;
        }

        .result-label {
            font-size: 0.9rem;
            color: #a0a0a0;
            margin-bottom: 0.5rem;
        }

        .result-value {
            font-size: 2rem;
            font-weight: bold;
            color: #00cec9;
            word-break: break-all;
        }

        .result-info {
            font-size: 0.8rem;
            color: #666;
            margin-top: 0.5rem;
        }

        .history {
            margin-top: 1rem;
            max-height: 200px;
            overflow-y: auto;
        }

        .history-item {
            background: rgba(0, 0, 0, 0.2);
            padding: 0.8rem;
            border-radius: 8px;
            margin-bottom: 0.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
        }

        .history-operation {
            color: #a0a0a0;
        }

        .history-result {
            color: #00cec9;
            font-weight: bold;
        }

        .error {
            color: #ff6b6b;
            background: rgba(255, 107, 107, 0.2);
            padding: 0.8rem;
            border-radius: 8px;
            margin-top: 1rem;
            text-align: center;
        }

        footer {
            margin-top: 2rem;
            text-align: center;
            color: #666;
        }

        footer a {
            color: #e94560;
            text-decoration: none;
        }

        @media (max-width: 768px) {
            .card {
                width: 100%;
            }

            header h1 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>🧮 Calculatrice Intégrée</h1>
        <p>Interface Web avec Backend Python et calculs C++</p>
        {% if using_cpp %}
        <span class="status-badge status-cpp">✓ Librairie C++ active</span>
        {% else %}
        <span class="status-badge status-python">⚡ Mode Python (C++ non compilé)</span>
        {% endif %}
    </header>

    <div class="container">
        <!-- Calculatrice Standard -->
        <div class="card">
            <h2>📊 Calculatrice Standard</h2>
            
            <div class="form-group">
                <label for="operation">Opération</label>
                <select id="operation" onchange="updateInputs()">
                    <optgroup label="Opérations binaires">
                        <option value="add">Addition (+)</option>
                        <option value="subtract">Soustraction (−)</option>
                        <option value="multiply">Multiplication (×)</option>
                        <option value="divide">Division (÷)</option>
                        <option value="power">Puissance (^)</option>
                    </optgroup>
                    <optgroup label="Opérations unaires">
                        <option value="sqrt">Racine carrée (√)</option>
                        <option value="sin">Sinus</option>
                        <option value="cos">Cosinus</option>
                        <option value="tan">Tangente</option>
                        <option value="ln">Log naturel (ln)</option>
                        <option value="log10">Log base 10</option>
                        <option value="exp">Exponentielle (e^x)</option>
                    </optgroup>
                    <optgroup label="Fonctions spéciales">
                        <option value="factorial">Factorielle (n!)</option>
                        <option value="fibonacci">Fibonacci</option>
                    </optgroup>
                </select>
            </div>

            <div class="input-row">
                <div class="form-group">
                    <label for="input-a">Valeur A</label>
                    <input type="number" id="input-a" value="0" step="any">
                </div>
                <div class="form-group" id="input-b-group">
                    <label for="input-b">Valeur B</label>
                    <input type="number" id="input-b" value="0" step="any">
                </div>
            </div>

            <button class="btn-primary" onclick="calculate()">Calculer</button>
            
            <div class="result-box">
                <div class="result-label">Résultat</div>
                <div class="result-value" id="result">0</div>
                <div class="result-info" id="result-info"></div>
            </div>

            <div id="error-box" class="error" style="display: none;"></div>
        </div>

        <!-- Historique -->
        <div class="card">
            <h2>📜 Historique</h2>
            <button class="btn-secondary" onclick="clearHistory()">Effacer l'historique</button>
            <div class="history" id="history">
                <p style="color: #666; text-align: center; padding: 2rem;">
                    L'historique apparaîtra ici
                </p>
            </div>
        </div>
    </div>

    <footer>
        <p>Application Flask + C++ | 
            <a href="/api/info" target="_blank">API Info</a>
        </p>
    </footer>

    <script>
        // Opérations qui ne nécessitent qu'un seul paramètre
        const unaryOperations = ['sqrt', 'sin', 'cos', 'tan', 'ln', 'log10', 'exp', 'factorial', 'fibonacci'];
        
        // Historique des calculs
        let calculationHistory = [];

        // Met à jour l'affichage des inputs selon l'opération
        function updateInputs() {
            const operation = document.getElementById('operation').value;
            const inputBGroup = document.getElementById('input-b-group');
            
            if (unaryOperations.includes(operation)) {
                inputBGroup.style.display = 'none';
            } else {
                inputBGroup.style.display = 'block';
            }

            // Met à jour le label du premier input selon l'opération
            const labelA = document.querySelector('label[for="input-a"]');
            if (operation === 'factorial' || operation === 'fibonacci') {
                labelA.textContent = 'n (entier)';
            } else if (unaryOperations.includes(operation)) {
                labelA.textContent = 'x';
            } else {
                labelA.textContent = 'Valeur A';
            }
        }

        // Effectue le calcul via l'API
        async function calculate() {
            const operation = document.getElementById('operation').value;
            const a = parseFloat(document.getElementById('input-a').value);
            const b = parseFloat(document.getElementById('input-b').value);
            
            const errorBox = document.getElementById('error-box');
            const resultEl = document.getElementById('result');
            const resultInfo = document.getElementById('result-info');
            
            errorBox.style.display = 'none';
            
            try {
                const response = await fetch('/api/calculate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ operation, a, b }),
                });
                
                const data = await response.json();
                
                if (data.error) {
                    errorBox.textContent = data.error;
                    errorBox.style.display = 'block';
                    return;
                }
                
                // Affiche le résultat
                resultEl.textContent = formatNumber(data.result);
                resultInfo.textContent = data.using_cpp ? '(calculé par C++)' : '(calculé par Python)';
                
                // Ajoute à l'historique
                addToHistory(operation, a, b, data.result);
                
            } catch (error) {
                errorBox.textContent = 'Erreur de connexion au serveur';
                errorBox.style.display = 'block';
            }
        }

        // Formate les grands nombres
        function formatNumber(num) {
            if (Number.isNaN(num)) return 'Erreur';
            if (!Number.isFinite(num)) return '∞';
            
            // Pour les très grands ou très petits nombres, utiliser la notation scientifique
            if (Math.abs(num) > 1e10 || (Math.abs(num) < 1e-6 && num !== 0)) {
                return num.toExponential(6);
            }
            
            // Arrondir à 10 décimales max
            return parseFloat(num.toPrecision(10)).toString();
        }

        // Obtient le symbole de l'opération
        function getOperationSymbol(op) {
            const symbols = {
                'add': '+', 'subtract': '−', 'multiply': '×', 'divide': '÷',
                'power': '^', 'sqrt': '√', 'sin': 'sin', 'cos': 'cos',
                'tan': 'tan', 'ln': 'ln', 'log10': 'log₁₀', 'exp': 'e^',
                'factorial': '!', 'fibonacci': 'fib'
            };
            return symbols[op] || op;
        }

        // Ajoute un calcul à l'historique
        function addToHistory(operation, a, b, result) {
            let operationStr;
            const symbol = getOperationSymbol(operation);
            
            if (unaryOperations.includes(operation)) {
                if (operation === 'factorial') {
                    operationStr = `${a}!`;
                } else if (operation === 'fibonacci') {
                    operationStr = `fib(${a})`;
                } else {
                    operationStr = `${symbol}(${a})`;
                }
            } else {
                operationStr = `${a} ${symbol} ${b}`;
            }
            
            calculationHistory.unshift({
                operation: operationStr,
                result: formatNumber(result)
            });
            
            // Limite l'historique à 20 entrées
            if (calculationHistory.length > 20) {
                calculationHistory.pop();
            }
            
            renderHistory();
        }

        // Affiche l'historique
        function renderHistory() {
            const historyEl = document.getElementById('history');
            
            if (calculationHistory.length === 0) {
                historyEl.innerHTML = `
                    <p style="color: #666; text-align: center; padding: 2rem;">
                        L'historique apparaîtra ici
                    </p>
                `;
                return;
            }
            
            historyEl.innerHTML = calculationHistory.map(item => `
                <div class="history-item">
                    <span class="history-operation">${escapeHtml(item.operation)}</span>
                    <span class="history-result">= ${escapeHtml(item.result)}</span>
                </div>
            `).join('');
        }

        // Efface l'historique
        function clearHistory() {
            calculationHistory = [];
            renderHistory();
        }

        // Échappe le HTML pour éviter les injections XSS
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = String(text);
            return div.innerHTML;
        }

        // Initialisation
        updateInputs();

        // Permet d'utiliser Enter pour calculer
        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                calculate();
            }
        });
    </script>
</body>
</html>
